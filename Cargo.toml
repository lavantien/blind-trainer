[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
proptest = "1.12.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
