name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: policy
        run: cargo run --locked -p bt-policy
      - name: check
        run: cargo check --workspace
      - name: build
        run: cargo build --release -p bt-app
      - name: test self-contained suites
        run: |
          cargo test -p bt-app
          cargo test -p bt-core --lib --test fuzzkill_analysis --test geometric_oracle --test parse_roundtrip
          cargo test -p bt-scheme --lib --test memo_more --test scramble_oracle
          cargo test -p bt-data
          cargo test -p bt-puzzles
          cargo test -p bt-ga --test fuzzkill_ga --test ga_public_surface --test inventory_more
          cargo test -p bt-gendata --lib
          cargo test -p bt-jobwrap
          cargo test -p bt-memofreq
          cargo test -p bt-mutants-gate
          cargo test -p bt-policy
          cargo test -p bt-release-verify
          cargo test -p bt-sleeper
          cargo test -p bt-visual-diff
          cargo test -p bt-verify --lib
          cargo test --manifest-path tests/e2e/Cargo.toml
