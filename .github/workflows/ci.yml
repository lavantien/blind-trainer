name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install llvm 23.1.4
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "LLVM-23.1.4-win64.msi"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/LLVM-23.1.4-win64.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0 -and $install.ExitCode -ne 3010) { exit 1 }
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvmBin\clang.exe")) { exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
      - name: setup
        run: python bt.py setup
      - name: vendor
        run: python scripts/vendor.py
      - name: grounding
        run: python scripts/fetch_docs.py --only vietnamese/syllables-7184-abc.txt
      - name: fmt
        run: python bt.py fmt
      - name: lint
        run: python bt.py lint
      - name: policy
        run: python bt.py policy
      - name: check
        run: python bt.py check
      - name: build
        run: python bt.py build
      - name: test
        shell: pwsh
        run: |
          foreach ($area in "common","core","scheme","data","puzzles","ga","e2e") {
            python bt.py test-unit $area
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          python bt.py test-unit tools --without ga_run_lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s tests/python
          if ($LASTEXITCODE -ne 0) { exit 1 }
